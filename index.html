  font-family:'Jua',sans-serif;
  box-shadow:0 2px 8px rgba(244,132,95,0.35);
}

/* ── contact ── */
.contact-section {
  background:linear-gradient(150deg, var(--blue-pale) 0%, white 50%, var(--salmon-pale) 100%);
  border-top:1px solid var(--border);
  padding:64px 24px; text-align:center; position:relative; overflow:hidden;
}
.contact-section::before {
  content:''; position:absolute; top:-80px; right:-60px;
  width:360px; height:360px; border-radius:50%;
  background:radial-gradient(circle,rgba(41,171,226,0.10) 0%,transparent 70%);
}
.contact-section h2 {
  font-family:'Jua',sans-serif; font-size:1.7rem;
  color:var(--text); margin-bottom:8px; position:relative;
}
.contact-section p { color:var(--text-muted); margin-bottom:32px; position:relative; }
.contact-grid {
  display:flex; flex-wrap:wrap; justify-content:center;
  gap:14px; max-width:620px; margin:0 auto; position:relative;
}
.contact-item {
  background:white; border:1.5px solid var(--border);
  border-radius:16px; padding:16px 24px;
  color:var(--text); min-width:140px;
  box-shadow:var(--shadow-sm);
  transition:all 0.2s;
}
.contact-item:hover { border-color:var(--blue); box-shadow:var(--shadow-md); }
.contact-item .ci-label { font-size:0.75rem; color:var(--blue-dark); font-weight:800; margin-bottom:4px; }
.contact-item .ci-value { font-size:0.9rem; font-weight:700; color:var(--text); }

footer {
  background:var(--text);
  padding:20px 24px; text-align:center;
  color:rgba(255,255,255,0.35); font-size:0.8rem;
}

/* 반응형 */
@media(max-width:768px) {
  .hero-inner { flex-direction:column; gap:36px; }
  .hero-sub { max-width:none; }
  .hero-tags { justify-content:center; }
  .hero-qr-wrap { display:none; }
  nav { padding:0 16px; }
  .stats-bar { padding:20px 16px; }
  .stat-item { padding:8px 18px; }
  .hero { padding:56px 20px 52px; }
}

/* qrcodejs */
#heroQR { display:inline-block; line-height:0; }
#heroQR canvas { display:block !important; }
#heroQR img { display:none !important; width:0 !important; height:0 !important; position:absolute !important; }
</style>
</head>
